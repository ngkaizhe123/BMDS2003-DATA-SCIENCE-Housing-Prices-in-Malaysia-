name: Malaysia Housing Prices ML CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f prototype/requirements.txt ]; then pip install -r prototype/requirements.txt; fi
          pip install flake8 black

      - name: Lint Code (Syntax and Undefined Names)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Code Formatting (Black)
        run: |
          black --check .

      - name: Verify Script Compilation
        run: |
          python -m py_compile src/data_preprocessing.py src/utils.py prototype/app.py
          python -m compileall src/models/